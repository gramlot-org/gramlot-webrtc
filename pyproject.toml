[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-webrtc"
version = "0.1.0"
description = "The Gramlot webrtc collection: LiveKit rooms in the browser, room operations and the page store."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["gramlot>=0.3.35", "genro-bag>=0.28.0", "livekit-api>=1.2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "genro-tytx[msgpack]"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-webrtc"
Repository = "https://github.com/gramlot-org/gramlot-webrtc"
Issues = "https://github.com/gramlot-org/gramlot-webrtc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_webrtc"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/js", "/README.md", "/LICENSE", "/NOTICE", "/package.json", "/gramlot.build.json", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
